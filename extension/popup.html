<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>JobPilot Autofill</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <strong>JobPilot</strong>
      <button id="toggle-settings" class="link" type="button">Settings</button>
    </header>

    <section id="settings" hidden>
      <label for="server">Server URL</label>
      <input id="server" placeholder="https://your-app.vercel.app" />
      <label for="token">API token</label>
      <input id="token" placeholder="jp_…" />
      <button id="save" type="button" class="primary">Save & connect</button>
      <p class="hint">Find both on the Extension page of your JobPilot dashboard.</p>
    </section>

    <section id="main">
      <p id="status" class="muted">Connecting…</p>
      <p id="job" class="job" hidden></p>
      <button id="fill" type="button" class="primary" disabled>Autofill this page</button>
      <button id="applied" type="button" disabled>Mark as applied</button>
      <p id="result" class="result"></p>
      <p class="hint">Autofill never submits. Review every field before you press Submit.</p>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
